<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/style.css">
    <title>Privacy</title>
</head>
<script>
    const loadComponents = (id, url) =>  {
        fetch(url)
        .then((response) => response.text())
        .then((html) => {
            document.getElementById(id).innerHTML = html;
        });
    }

    window.onload = () => {
        loadComponents('header', '/sections/header.html');
        loadComponents('mobile-header', '/sections/mobile-navBar.html');
        loadComponents('privacy', '/sections/page3/section1.html');
        loadComponents('footer', '/sections/footer.html');
    }
</script>
<body class="font-[Outfit] font-medium bg-[#EFECEA] ">
    <div id="header"></div>
    <div id="mobile-header"></div>
	<div id="privacy"></div>
    <div id="footer"></div>
</body>
</html>
