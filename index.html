<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/style.css">
    <title>Website project</title>
</head>
<script>
    const loadComponents = (id, url) =>  {
        fetch(url)
        .then((response) => response.text())
        .then((html) => {
            document.getElementById(id).innerHTML = html;
        });
    }

    window.onload = () => {
        loadComponents('header', '/sections/header.html');
        loadComponents('mobile-header', '/sections/mobile-navBar.html');
        loadComponents('hero', '/sections/hero.html');
        loadComponents('contact', '/sections/contact.html');
        loadComponents('yellowSection', '/sections/yellowSection.html');
        loadComponents('footer', '/sections/footer.html');
        loadComponents('page1_section1', '/sections/page1_section1.html');
        loadComponents('page1_section2', '/sections/page1_section2.html');
    }
</script>
<body class="bg-[#EFECEA]">
    <div id="mobile-header"></div>
    <div id="header"></div>
    <div id="hero"></div>
    <div id="page1_section1"></div>
    <div id="page1_section2"></div>
    <div id="yellowSection"></div>
    <div id="footer"></div>

    <script src="/scripts/header.js" defer></script>

</body>
</html>
